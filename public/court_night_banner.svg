<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="100%" height="100%">
  <defs>
    <!-- Dark Court Gradient for Left 60% with Deep Obsidian & Teal -->
    <linearGradient id="bgBaseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04080b" />
      <stop offset="45%" stop-color="#061217" />
      <stop offset="65%" stop-color="#0b1e25" />
      <stop offset="85%" stop-color="#1f1810" />
      <stop offset="100%" stop-color="#2a1608" />
    </linearGradient>

    <!-- Parquet Floor Perspective Shading -->
    <linearGradient id="floorShading" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#081014" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#11181e" stop-opacity="0.85" />
    </linearGradient>

    <!-- Warm Amber Spotlight Cones -->
    <radialGradient id="spotlightAmber" cx="80%" cy="15%" r="65%" fx="80%" fy="10%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#b45309" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#04080b" stop-opacity="0" />
    </radialGradient>

    <!-- Overhead Secondary Spotlight -->
    <radialGradient id="overheadLight" cx="62%" cy="5%" r="45%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#04080b" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Cyan Rim Backlight -->
    <radialGradient id="spotlightCyan" cx="95%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#04080b" stop-opacity="0" />
    </radialGradient>

    <!-- Floor Gloss Reflection for Orange Light -->
    <radialGradient id="floorAmberReflection" cx="78%" cy="75%" r="40%" fx="75%" fy="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#78350f" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Rim Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1800" height="600" fill="url(#bgBaseGradient)" />

  <!-- 2. Volumetric Stadium Spotlight Beams -->
  <!-- Amber Main Cone -->
  <polygon points="1200,0 1650,0 1800,600 1150,600" fill="url(#spotlightAmber)" opacity="0.85" />
  <!-- Cyan Accent Beam -->
  <polygon points="1550,0 1800,0 1800,600 1500,600" fill="url(#spotlightCyan)" opacity="0.75" />
  <!-- Overhead Ambient Light -->
  <polygon points="1050,0 1250,0 1400,600 900,600" fill="url(#overheadLight)" opacity="0.6" />

  <!-- 3. Parquet Hardwood Floor Layer (Perspective from y=340 to 600) -->
  <g opacity="0.35">
    <!-- Perspective floor lines -->
    <line x1="0" y1="420" x2="1800" y2="420" stroke="#f59e0b" stroke-width="0.7" opacity="0.3" />
    <line x1="0" y1="470" x2="1800" y2="470" stroke="#f59e0b" stroke-width="0.8" opacity="0.4" />
    <line x1="0" y1="530" x2="1800" y2="530" stroke="#f59e0b" stroke-width="1.0" opacity="0.5" />
    <line x1="0" y1="600" x2="1800" y2="600" stroke="#f59e0b" stroke-width="1.2" opacity="0.6" />

    <!-- Hardwood Plank Cross-sections -->
    <path d="M 1000 380 L 850 600 M 1120 380 L 1020 600 M 1240 380 L 1180 600 M 1360 380 L 1340 600 M 1480 380 L 1500 600 M 1600 380 L 1660 600 M 1720 380 L 1800 600" stroke="#f59e0b" stroke-width="0.6" opacity="0.35" />
    <path d="M 600 380 L 350 600 M 750 380 L 550 600 M 880 380 L 720 600" stroke="#06b6d4" stroke-width="0.5" opacity="0.2" />
  </g>

  <!-- 4. Floor Specular Reflection on Right Side -->
  <ellipse cx="1450" cy="500" rx="360" ry="100" fill="url(#floorAmberReflection)" />
  <ellipse cx="1680" cy="520" rx="180" ry="60" fill="#22d3ee" opacity="0.12" filter="url(#softBlur)" />

  <!-- 5. Court Lines in Perspective (Right 40%) -->
  <g stroke="#ffffff" opacity="0.45" stroke-width="2.5" fill="none">
    <!-- Key lane box outline -->
    <polygon points="1280,560 1750,540 1780,600 1240,600" stroke-width="2.5" />
    <!-- Free throw / key circle arc in perspective -->
    <ellipse cx="1340" cy="440" rx="130" ry="24" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  </g>

  <!-- 6. Secondary Distant Basketball Hoop Silhouette in Soft Bokeh Blur -->
  <g opacity="0.3" filter="url(#softBlur)" transform="translate(1080, 180)">
    <rect x="0" y="0" width="80" height="55" rx="3" stroke="#fef08a" stroke-width="3" fill="none" />
    <rect x="25" y="20" width="30" height="22" stroke="#fef08a" stroke-width="2" fill="none" />
    <ellipse cx="40" cy="55" rx="14" ry="4" fill="#f97316" />
    <line x1="40" y1="55" x2="40" y2="120" stroke="#f59e0b" stroke-width="4" />
  </g>

  <!-- 7. Foreground Basketball Hoop & Backboard Silhouette (Right Side) -->
  <g id="mainHoopSystem" transform="translate(1320, 10)">
    <!-- Heavy Support Arm & Post Silhouette -->
    <path d="M 360,590 L 380,590 L 400,280 L 410,140 L 320,110 L 260,115 L 255,135 L 300,135 L 350,160 L 340,300 Z" fill="#05090d" />
    <!-- Support strut highlights in warm rim light -->
    <path d="M 405,145 L 325,115 L 260,120" stroke="#f59e0b" stroke-width="2" opacity="0.75" />
    <path d="M 410,140 L 390,290" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />

    <!-- Glass Backboard Structure -->
    <!-- Outer Backboard Frame with Glass Tint -->
    <rect x="80" y="20" width="220" height="150" rx="4" fill="rgba(8, 20, 28, 0.45)" stroke="#ffffff" stroke-width="3" opacity="0.85" />
    <!-- Rim Light on top of Backboard -->
    <line x1="80" y1="20" x2="300" y2="20" stroke="#fef08a" stroke-width="3" opacity="0.9" filter="url(#glowEffect)" />
    <!-- Inner Target Square on Backboard -->
    <rect x="145" y="70" width="90" height="70" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />

    <!-- Heavy Duty Rim Bracket -->
    <rect x="175" y="142" width="30" height="12" rx="2" fill="#ea580c" />
    <polygon points="175,150 160,165 220,165 205,150" fill="#c2410c" />

    <!-- Glowing Orange Steel Rim -->
    <ellipse cx="190" cy="165" rx="35" ry="9" fill="rgba(249, 115, 22, 0.85)" stroke="#fb923c" stroke-width="3.5" filter="url(#glowEffect)" />
    <ellipse cx="190" cy="165" rx="30" ry="7" fill="none" stroke="#ffedd5" stroke-width="1.5" opacity="0.8" />

    <!-- Hanging Basketball Net Catching Spotlight -->
    <g stroke="#ffffff" stroke-width="1.2" opacity="0.75" fill="none">
      <path d="M 160,168 L 165,225 L 175,255 L 190,260 L 205,255 L 215,225 L 220,168" stroke-width="1.8" />
      <path d="M 165,170 Q 190,195 215,170" />
      <path d="M 167,185 Q 190,210 213,185" />
      <path d="M 170,205 Q 190,230 210,205" />
      <path d="M 174,225 Q 190,245 206,225" />
      <!-- Diagonal net mesh -->
      <line x1="162" y1="168" x2="200" y2="258" />
      <line x1="172" y1="168" x2="208" y2="250" />
      <line x1="185" y1="168" x2="215" y2="230" />
      <line x1="218" y1="168" x2="180" y2="258" />
      <line x1="208" y1="168" x2="172" y2="250" />
      <line x1="195" y1="168" x2="165" y2="230" />
    </g>
  </g>

  <!-- 8. Atmospheric Bokeh & Dust Particles in Light Beam -->
  <g opacity="0.6">
    <!-- Amber Bokeh Orbs -->
    <circle cx="1180" cy="220" r="16" fill="#fbbf24" opacity="0.25" filter="url(#softBlur)" />
    <circle cx="1260" cy="160" r="28" fill="#f59e0b" opacity="0.3" filter="url(#softBlur)" />
    <circle cx="1420" cy="280" r="12" fill="#fbbf24" opacity="0.35" filter="url(#softBlur)" />
    <circle cx="1600" cy="240" r="34" fill="#f97316" opacity="0.25" filter="url(#softBlur)" />
    <!-- Cyan Bokeh Orbs -->
    <circle cx="1680" cy="160" r="22" fill="#22d3ee" opacity="0.3" filter="url(#softBlur)" />
    <circle cx="1740" cy="280" r="18" fill="#06b6d4" opacity="0.2" filter="url(#softBlur)" />
    <!-- Tiny Dust Motes caught in the beam -->
    <circle cx="1220" cy="140" r="2.5" fill="#fef08a" opacity="0.8" />
    <circle cx="1280" cy="240" r="1.8" fill="#ffffff" opacity="0.7" />
    <circle cx="1340" cy="190" r="2.2" fill="#fef08a" opacity="0.85" />
    <circle cx="1380" cy="310" r="1.5" fill="#ffffff" opacity="0.6" />
    <circle cx="1460" cy="210" r="2.8" fill="#fde047" opacity="0.75" />
    <circle cx="1520" cy="170" r="1.6" fill="#ffffff" opacity="0.9" />
    <circle cx="1580" cy="290" r="2.0" fill="#22d3ee" opacity="0.7" />
    <circle cx="1640" cy="210" r="1.8" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 9. Left 60% Heavy Shadow Dark Gradient (Guarantees Text Readability) -->
  <linearGradient id="textSafeOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#04080b" stop-opacity="0.98" />
    <stop offset="45%" stop-color="#04080b" stop-opacity="0.92" />
    <stop offset="65%" stop-color="#050c10" stop-opacity="0.65" />
    <stop offset="85%" stop-color="#050c10" stop-opacity="0.15" />
    <stop offset="100%" stop-color="#050c10" stop-opacity="0" />
  </linearGradient>
  <rect width="1800" height="600" fill="url(#textSafeOverlay)" />
</svg>
